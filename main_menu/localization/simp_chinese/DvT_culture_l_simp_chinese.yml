 archon_group: "魔神战争"
 archon_group_desc: "世上曾有诸多魔神，也曾有旷日持久的战争直到两千年前方才终结。期间生灵涂炭，流血无数。最终，提瓦特只剩下七位胜利者，七位魔神各自登上「神」之座，自此终结了「魔神战争」时代。尘世划归七神所有，他们被称作「尘世七执政」。虽然性格迥异又相隔万里，却都肩负着「引导人类」的神圣职责。他们在败者的残骸上建立国度与城邦，开始了七神的时代。"
