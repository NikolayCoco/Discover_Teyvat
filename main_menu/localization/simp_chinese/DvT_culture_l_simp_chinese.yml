l_simp_chinese:
 teyvat_group: "提瓦特"
 teyvat_group_desc: "这里是七种元素交汇的幻想世界「提瓦特」。\n在遥远的过去，人们借由对神灵的信仰，获赐了驱动元素的力量，得以在荒野中筑起家园。\n五百年前，古国的覆灭却使得天地变异…\n如今，席卷大陆的灾难已经停息，和平却仍未如期光临。"
 teyvat_culture: "提瓦特"
 khaenri_culture: "坎瑞亚"
 hilichurl_culture: "丘丘人"
 seelie_culture: "仙灵"
 dragon_group: "龙族"
 dragon_group_desc: "法涅斯占领提瓦特前统御大地的七位元素龙王。后来与法涅斯大战后凋零，古龙大权被夺走，有的死亡，有的背地里继续反抗天理。龙王为「元素生命的顶点」。龙王们的共主为尼伯龙根。"
 dragon_culture: "尼伯龙根"
 anemo_dragon_culture: "风龙"
