 cryo_dragon_culture: "冰龙"
 moons_culture: "三月"
 celestia_group: "天空岛"
 celestia_group_desc: "神居住之所，是天理秩序的象征，提瓦特的凡人曾经能直接听到来自天空岛的启示。神灵透过「神之心」的魔力器官与天空岛共鸣相连。他们和提瓦特世界中的其他的神都与天空岛有联系，但对此话题保持沉默。"
 celestia_culture: "法涅斯"
 shadows_culture: "四影"
 angel_culture: "天使"
 teyvat_1_group: "第一统一文明"
 teyvat_1_group_desc: "法涅斯降临后，葬火之战前天理引导初民创立的提瓦特第一个统一文明，足迹遍布大陆。建筑的特征是凯尔特三角结。"
