l_simp_chinese:
 Archonism: "魔神信仰"
 Archonism_ADJ: "魔神信仰"
 Archonism_desc: "@DvT_main!人们所说的七神，更本源的称谓就是「尘世七执政」。划分尘世、各自统治七分之一，这是作为神明的责任。魔神战争结束，提瓦特大陆上的魔神所剩无几。除去少部分逃到暗之外海，大部分不是战死就是被镇压。最终幸存的七位魔神得到神之心，且与神座绑定，加冕成为尘世七执政。七神代表着七种元素，追寻着七种理念。"
