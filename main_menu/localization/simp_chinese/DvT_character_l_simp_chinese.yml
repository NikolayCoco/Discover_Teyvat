 DvT_character_events.1.title: "邀请原神角色：[target_character.GetName]"
 DvT_character_events.1.desc: "无论相隔多远，命定相遇的人都会受缘石辉光的指引，在星空下相会。\n缘石辉光能让本无交集的命运交错，让彼此的梦想相连，正如这种光辉将群星连成心之所向的图形。"
 DvT_character_events.1.desc_immortal: "$DvT_character_events.1.desc$\n\n#italic [target_character.GetName]是一位长生种，将会陪伴你走过漫长的旅途。#!"
 DvT_character_events.1.desc_child: "$DvT_character_events.1.desc$\n\n#italic [target_character.GetName]还只是一个孩子，将会在16岁后正式参与事务。#!"
 DvT_character_events.1.a: "命定之缘"
 DvT_anemo_trait: "@anemo!风元素力"
 DvT_anemo_text: "「但风向是会转变的。」\n「终有一天，会吹向更有光亮的方向。」\n「从今往后，带着我的祝福，活得更加从容一些吧。」"
 desc_DvT_anemo_trait: "@anemo!$DvT_anemo_text$"
 DvT_geo_trait: "@geo!岩元素力"
 DvT_geo_text: "「大陆所流通的一切银钱皆是我的血肉。」\n「我在以这样的方式，为人类—切的汗水、智慧和未来做担保。」\n「这是我对众生的信任，辜负了它就是玷污了我的血。」"
 desc_DvT_geo_trait: "@geo!$DvT_geo_text$"
 DvT_electro_trait: "@electro!雷元素力"
 DvT_electro_text: "「此身即是尘世最为殊胜尊贵之身。」\n「应持天下之大权。」\n「此身曾许诺予臣民—梦，即是千世万代不变不移的『永恒』。」"
 desc_DvT_electro_trait: "@electro!$DvT_electro_text$"
 DvT_dendro_trait: "@dendro!草元素力"
 DvT_dendro_text: "「我做了一个很长很长的梦…」\n「人们手握着手转圈。贤者与愚者，舞女与勇士，人偶与神像…」\n「大家的欢舞里蕴藏着宇宙的一切。『生命』一直都是目的，『智慧』才是手段。」"
 desc_DvT_dendro_trait: "@dendro!$DvT_dendro_text$"
 DvT_hydro_trait: "@hydro!水元素力"
 DvT_hydro_text: "「我的理想之内并没有一丝污浊。」\n「我要纠正你，在这里，人并不对神背负罪孽，能下达判决的只有法律与裁判庭。」\n「他们甚至连我也可以裁判。赞美我的崇高与纯洁吧。」"
 desc_DvT_hydro_trait: "@hydro!$DvT_hydro_text$"
 DvT_pyro_trait: "@pyro!火元素力"
 DvT_pyro_text: "「为了愿望而步上巡礼，为了最强之名而云聚争斗…\n「最后为了梦在劫火中燃尽。\n「灰烬中如果留下了最初的心，那他就达成了██的真实。」"
 desc_DvT_pyro_trait: "@pyro!$DvT_pyro_text$"
 DvT_cryo_trait: "@cryo!冰元素力"
 DvT_cryo_text: "「…抱歉让你们一起和我背负了整个世界的哀思。\n「你们既然能忍受我的苦寒，那心中一定都有炽烈的欲望吧？\n「那么，替我燃烧旧世界吧。」"
 desc_DvT_cryo_trait: "@cryo!$DvT_cryo_text$"
 DvT_all_trait: "@other!降临者"
 DvT_other_text: "「欢迎来到世界。」"
 desc_DvT_all_trait: "@other!$DvT_other_text$"
 DvT_Mondstadt_trait: "@Mondstadt!蒙德"
 DvT_Mondstadt_text: "蒙德是位于提瓦特大陆东北部的自由城邦，被称为「风与牧歌的城邦」。信奉风与自由之神、微风与希望之神巴巴托斯，是提瓦特大陆上的尘世七国之一。\n群山和广袤的平原间，自由之风携着蒲公英的气息吹拂过果酒湖，为坐落于湖心岛上的蒙德城送去风神巴巴托斯的祝福与恩泽。"
 desc_DvT_Mondstadt_trait: "@Mondstadt!$DvT_Mondstadt_text$"
 DvT_Liyue_trait: "@Liyue!璃月"
 DvT_Liyue_text: "璃月是位于提瓦特大陆东方的富饶港湾，被称为「岩与契约的海港」。信奉岩与契约之神、岩王帝君摩拉克斯，是提瓦特大陆上的尘世七国之一。\n傲然矗立的山麓与石林、广袤的平原与生机勃勃的河滩共同构成了璃月的丰富地貌，在四季分明的气候下焕发出多彩的风华。山石奇景间，又埋藏了多少岩之魔神的古老馈赠等待着人们发掘呢？"
 desc_DvT_Liyue_trait: "@Liyue!$DvT_Liyue_text$"
 DvT_Inazuma_trait: "@Inazuma!稻妻"
 DvT_Inazuma_text: "稻妻是位于提瓦特大陆远东的封闭群岛，被称为「雷与永恒的群岛」。信奉雷与永恒之神、御建鸣神主尊大御所大人巴尔与巴尔泽布，是提瓦特大陆上的尘世七国之一。\n越过无尽的雷暴，踏上红枫与绯樱眷顾的诸岛，在环绕的砂堤、高耸的断崖与幽秘的山林之中，见证御建鸣神主尊大御所大人所追寻的永恒。"
 desc_DvT_Inazuma_trait: "@Inazuma!$DvT_Inazuma_text$"
 DvT_Sumeru_trait: "@Sumeru!须弥"
 DvT_Sumeru_text: "须弥是位于提瓦特大陆中西部的学城之都被称为「草与智慧的国度」。其雨林地区被称为「玄识深藏的雨林」，沙漠地区则被称为「饰金砂原」。信奉草与智慧之神、摩诃善法大吉祥智慧主与小吉祥草王布耶尔，是提瓦特大陆上的尘世七国之一。\n同时拥有葱郁雨林与荒芜沙土的奇异国度，无数智慧的果实在这里生长、埋葬。无论是穿越丛林踏上学城的台阶，还是深入沙漠挖掘赤土的遗迹，远道而来的旅者都可以在此获取宝贵的智识。在智慧之神的庇护下，须弥的学者圣人摒弃世俗，追求深奥的智慧。"
 desc_DvT_Sumeru_trait: "@Sumeru!$DvT_Sumeru_text$"
 DvT_Fontaine_trait: "@Fontaine!枫丹"
 DvT_Fontaine_text: "枫丹是位于提瓦特大陆中部地上大湖的律法之廷，被称为「水与公义的枢廷」。信奉水与正义之神、众水、众方、众民与众律法的女王芙卡洛斯，是提瓦特大陆上的尘世七国之一。\n循着水淳淳流来的方向而行，越过原野、深林与沙海，抵达的将是大陆水系的源流之地。在瀑布顶端、高原之上的海都深处，从未听闻的故事、早已遗忘的传说如同沉入水底的失落国度般渴求着游人。"
 desc_DvT_Fontaine_trait: "@Fontaine!$DvT_Fontaine_text$"
 DvT_Natlan_trait: "@Natlan!纳塔"
 DvT_Natlan_text: "纳塔是位于提瓦特大陆西部的盟誓之邦，被称为「火与竞逐的盟地」。信奉火与战争之神，「基扬戈兹」赫布里穆，是提瓦特大陆上的尘世七国之一。\n跟随焰光的指引，穿越长峡与溪谷，那煌然的火炬熊熊燃烧之地，亦是众火归一之处。在这龙众驰行的燎火之原上，与抵抗黑暗的勇士们一同见证悠古战争的终末吧。"
 desc_DvT_Natlan_trait: "@Natlan!$DvT_Natlan_text$"
 DvT_NodKrai_trait: "@NodKrai!挪德卡莱"
 DvT_NodKrai_text: "挪德卡莱是位于提瓦特大陆西北部的月佑之地，被称为「月与浪迹的乐园」。是至冬地区的自治区。\n循着新月纺出的银线前行，渡越凛冽的寒风与苍冷的苔原，如碎镜的湖泊中映出的是亘古不移的霜色辉芒。白日苦短，然而漫长的黑夜中，总会有空月的光与歌轻柔地抚过旅者的面影。点亮高塔上的灯火吧，直至真实的月光照耀这片土地的那一日。"
 desc_DvT_NodKrai_trait: "@NodKrai!$DvT_NodKrai_text$"
 DvT_Snezhnaya_trait: "@Snezhnaya!至冬"
 DvT_Snezhnaya_text: "至冬是位于提瓦特大陆北部的永冬之国，被称为「冰与苍星的圣都」，信奉冰与慈爱之神、冰之女皇巴纳巴斯，是提瓦特大陆上的尘世七国之一。\n不畏苦寒、不惧厄难，迎着咆哮的漫天风雪，跨越沉寂肃穆的冻土与钢铁轰鸣的都市，直抵无神怜爱的严冬。抬起头来仰望无垢的苍星吧，纵然极寒早已吹熄往日的温存——与心怀炽烈欲望与哀思的人们一同，见证旧世界在冰上燃烧的那一刻吧。"
 desc_DvT_Snezhnaya_trait: "@Snezhnaya!$DvT_Snezhnaya_text$"
 DvT_Other_trait: "@Other!异界"
 DvT_Other_text: "星球，又被称为「世界」。每个星球都有自己的法则。各星球可能存在文明，各文明的人们可以透过飞船在各星球间穿梭，即星际旅行。星球间的人们存在战争与跨世界贸易。星球间存在星际旅行中转站。宇宙的终极法则是「生者必灭」。"
 desc_DvT_Other_trait: "@Other!$DvT_Other_text$"
