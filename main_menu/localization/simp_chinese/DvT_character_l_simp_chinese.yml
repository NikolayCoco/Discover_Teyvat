 desc_DvT_aleiqinuo_01_trait: "@pyro!我是愚人众执行官第四席，「仆人」阿蕾奇诺，也是壁炉之家的孩子们口中的「父亲」。希望我们相处愉快——这并非什么难事，现在的我们还没有冲突的理由，不是吗？"
 DvT_aleiqinuo_02_trait: "@pyro!「仆人」 阿蕾奇诺·两界之火的遗烬"
 desc_DvT_aleiqinuo_02_trait: "@pyro!我是愚人众执行官第四席，「仆人」阿蕾奇诺，也是壁炉之家的孩子们口中的「父亲」。希望我们相处愉快——这并非什么难事，现在的我们还没有冲突的理由，不是吗？\n\n愚人众执行官第四席，「仆人」。\n古老的厄月之血流淌在她的命运中，赐予她王朝曾经拥有过的一切，无论是渴望、力量还是诅咒。\n短暂的时岁里，她已见证过无数苦难，饮下过无数苦难，正如先祖在黑日升起之时饮下鸩毒那般。\n\n然而无论是苦难还是命运，对她而言从来也不是致命的毒。\n那是静燃于壁炉中的薪柴，也是为孩子们带来温暖的炉火。\n\n终有一日，如今依然微茫的炉火将焚尽旧世界的一切，也焚尽厄月最后的血裔。\n终有一日，如今依然稚嫩的孩子们会冲破昔日的命运，迎向她梦中无泪的未来。\n而在那之前，在黎明到来之前，名为佩露薇利之人，将守望那柔弱而甜美的梦。\n\n#italic 「若是命运铺就苍白的旅路，那便为它染上厄月的血色」\n「纵是终将殄熄的残蚀之火，也足以在黎明前焚尽苦厄」#!"
