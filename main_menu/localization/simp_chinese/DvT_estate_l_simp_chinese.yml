l_simp_chinese:
 vision_estate: "「神之眼」持有者"
 vision_estate_desc: "面对无法掌控的境遇时，人们总是喟叹自身的无力。但在人生最陡峭的转折处，若有凡人的「渴望」达到极致，神明的视线就将投射而下。这就是「神之眼」，受神认可者所获的外置魔力器官，用以引导元素之力。\n每一位「神之眼」的拥有者，都是有资格成神的人，因此被称作「原神」，拥有登上天空岛的资格。——这是只有真正神灵才知道的秘密。"
 vision_pop: "「神之眼」持有者"
 vision_pop_desc: "这些人代表了来自异世界的「神之眼」持有者。"
 MODIFIER_TYPE_NAME_vision_estate_target_satisfaction: "$vision_estate$满意度均衡点"
 MODIFIER_TYPE_DESC_vision_estate_target_satisfaction: "这影响该[country|e]$vision_estate$的[estate_satisfaction_equilibrium|e]。"
 MODIFIER_TYPE_NAME_vision_estate_satisfaction_decay: "$vision_estate$满意度衰减"
 MODIFIER_TYPE_DESC_vision_estate_satisfaction_decay: "这影响该[country|e]的$vision_estate$的[estate_satisfaction|e]衰减至[estate_satisfaction_equilibrium|e]的速度。"
 MODIFIER_TYPE_NAME_vision_estate_satisfaction_recovery: "$vision_estate$满意度恢复"
 MODIFIER_TYPE_DESC_vision_estate_satisfaction_recovery: "这影响该[country|e]的$vision_estate$的[estate_satisfaction|e]恢复至[estate_satisfaction_equilibrium|e]的速度。"
 MODIFIER_TYPE_NAME_global_vision_estate_power: "$vision_estate$[estate_power|e]"
 MODIFIER_TYPE_DESC_global_vision_estate_power: "这影响整个[country|e]的$vision_estate$的[estate_power|e]。"
 MODIFIER_TYPE_NAME_local_vision_estate_power: "本地$vision_estate$[estate_power|e]"
 MODIFIER_TYPE_DESC_local_vision_estate_power: "这影响该[location|e]的$vision_estate$的[estate_power|e]。"
 MODIFIER_TYPE_NAME_vision_estate_allowed_in_cabinet: "$vision_estate$允许在内阁任职"
 MODIFIER_TYPE_DESC_vision_estate_allowed_in_cabinet: "这允许[ShowEstateTypeName('vision_estate')][estate|e][characters|e]在[cabinet|e]任职。"
 MODIFIER_TYPE_NAME_vision_estate_allowed_leading_military: "$vision_estate$允许指挥军队"
 MODIFIER_TYPE_DESC_vision_estate_allowed_leading_military: "这允许[ShowEstateTypeName('vision_estate')][estate|e][characters|e]担任[generals|e]或[admirals|e]。"
 vision_estate_satisfaction: "[ShowEstateTypeName('vision_estate')][estate_satisfaction|e]"
 vision_estate_power: "[ShowEstateTypeName('vision_estate')][estate_power|e]"
 vision_estate_base: "整合「神之眼」持有者社群"
 vision_estate_base_desc: "「神之眼」持有者数量稀少，且分布零散。为了更好的管理「神之眼」持有者，并使其在国内事务中发挥更大的作用，我们应当整合散布的「神之眼」持有者社群。\n#G 这是其他特权的基础。#!"
 vision_estate_anemo: "深入@anemo!风元素力"
 vision_estate_anemo_desc: "@anemo!风元素力可以减少我们改造自然的成本、帮助我们的商船航行，以及让我们的陆军以更快的速度追击敌军。\n#G 在拥有#!@anemo!#T 温迪#!#G 的情况下，该特权提供的增益将会翻倍。#!"
 vision_estate_geo: "深入@geo!岩元素力"
 vision_estate_geo_desc: "@geo!岩元素力可以帮助我们建造建筑、保护我们的贸易，以及强化我们的堡垒。\n#G 在拥有#!@geo!#Y 钟离#!#G 的情况下，该特权提供的增益将会翻倍。#!"
 vision_estate_electro: "深入@electro!雷元素力"
 vision_estate_electro_desc: "@electro!雷元素力可以帮助我们加强对地方的管理、提高我们的声誉，以及增强我们的陆军。\n#G 在拥有#!@electro!#V 雷电将军#!#G 的情况下，该特权提供的增益将会翻倍。#!"
 vision_estate_dendro: "深入@dendro!草元素力"
 vision_estate_dendro_desc: "@dendro!草元素力可以帮助我们生产、加强我们与属国的联系，以及增强我们的围城能力。\n#G 在拥有#!@dendro!#J 纳西妲#!#G 的情况下，该特权提供的增益将会翻倍。#!"
 vision_estate_hydro: "深入@hydro!水元素力"
 vision_estate_hydro_desc: "@hydro!水元素力可以帮助我们稳定国家、加快我们的殖民地建设，以及治疗我们的伤员。\n#G 在拥有#!@hydro!#M 芙宁娜#!#G 或@hydro!#!#M 那维莱特#!#G 的情况下，该特权提供的增益将会翻倍。#!"
 vision_estate_pyro: "深入@pyro!火元素力"
 vision_estate_pyro_desc: "@pyro!火元素力可以助力我们的科学实验、增强我们的海军火力和陆军火力。\n#G 在拥有#!@pyro!#R 玛薇卡#!#G 的情况下，该特权提供的增益将会翻倍。#!"
 vision_estate_cryo: "深入@cryo!冰元素力"
 vision_estate_cryo_desc: "@cryo!冰元素力可以帮助我们开垦荒地、加强我们海军和陆军的适应性。"
 vision_estate_leader: "给予「神之眼」持有者军事指挥权"
 vision_estate_leader_desc: "允许「神之眼」持有者领军打仗。"
 vision_estate_advisor: "「神之眼」持有者顾问权"
 vision_estate_advisor_desc: "允许「神之眼」持有者建言献策。"