l_simp_chinese:
 DvT_adventurer_guild_IO: "冒险家协会"
 DvT_adventurer_guild_IO_desc: "#italic 「向着星辰与深渊！欢迎来到冒险家协会。」#!"
 AG_desc: "冒险者协会在我们与提瓦特之间建立了联系。在这里，我们可以邂逅来自异世界的同伴。"
 DvT_adventurer_guild_IO_hint_title: "$DvT_events.1.title$"
 DvT_adventurer_guild_IO_hint_desc: "$DvT_events.1.desc$"
 AG_Pay_30: "@WelkinMoon! 长期投资冒险家协会"
 DvT_luno_text: "于新月初升之时，向天空之月祈求财富与好运的仪式。你完全可以认为这是提瓦特的第一轮新月，至少是你见到的第一轮。"
 AG_Pay_30_desc: "@WelkinMoon!$DvT_luno_text$\n\n#italic @WelkinMoon!最有性价比的月卡！#!"
 AG_Pay_30_desc_2: "花费#N -30#!@gold!，立即获取#P 300#!@primogem!，并获得#italic 空月祝福@WelkinMoon!#!：每月额外获得#P 90#!@primogem!，持续30个月。"
 AG_Pay_30_tooltip_1: "获得#P 300#!@primogem!"
 AG_Pay_30_tooltip_2: "获得#italic 空月祝福@WelkinMoon!#!，每月额外获得#P 90#!@primogem!，持续30个月。"
 AG_Pay_648: "@GenesisCrystal!一次性投资冒险家协会"
 AG_Pay_648_desc: "@GenesisCrystal!开辟宇宙的能量结晶。虚无的真空中，由足以点亮新星的潜力和希望结晶而成。\n\n#italic @GenesisCrystal!双倍福利，永不过期！#!"
 AG_Pay_648_desc_2: "花费#N -648#!@gold!，立即获取#P 12960#!@primogem!。"
 AG_Pay_648_tooltip: "获得#P 12960#!@primogem!"
 AG_Primogem: "@primogem!原石"
 AG_Primogem_desc: "@primogem!超出世界的原始晶石。黑暗的宇宙中，由无主的梦想与希望凝结而成的辉光。"
 AG_Primogem_Blessing: "@WelkinMoon!空月祝福"
 AG_Primogem_Blessing_desc: "@WelkinMoon!$DvT_luno_text$"
 AG_Primogem_Change: "每月变化"
 AG_Primogem_Change_Value: "每月固定获得#P 60#!@primogem!。若有#italic 空月祝福@WelkinMoon!#!，会每月额外获得#P 90#!@primogem!。每个在国际组织冒险家协会中的原神领附庸国每月额外提供#P 10#!@primogem!。"
 AG_has_Primogem_Blessing_text: "（空月祝福@WelkinMoon!已消耗[GetPlayer.MakeScope.GetVariable('AG_Primogem_Blessing').GetValue]个月）"
 AG_create_character: "@IntertwinedFate!邀请原神角色"
 AG_create_character_desc: "@IntertwinedFate!缘石辉光能让本无交集的命运交错，让彼此的梦想相连，正如这种光辉将群星连成心之所向的图形。\n\n#italic @IntertwinedFate!邀请一位原神角色加入我们的国家！#!"
 DvT_exist_character_tooltip: "@IntertwinedFate!存在可邀请的原神角色"
 DvT_create_character_random_tooltip: "@IntertwinedFate!随机#P 获得一位#!原神角色。"
 AG_create_pop: "@AcquaintFate!邀请「神之眼」持有者"
 AG_create_pop_desc: "@AcquaintFate!无论相隔多远，命定相遇的人都会受缘石辉光的指引，在星空下相会。\n\n#italic @AcquaintFate!邀请「神之眼」持有者来添补我们冒险家协会的空缺。#!"
 AG_Pay_1600_tooltip: "花费#N -1600#!@primogem!。"
 AG_Primogem_for_golden: "@gold!回收原石"
 AG_Primogem_for_golden_desc: "@gold!原石多余或者需要金币应急时，可将原石转换为金币。"
 AG_Convert_to_Archonism: "@DvT_main!皈依魔神信仰"
 AG_Convert_to_Archonism_desc: "@DvT_main!尘世执政已为我们展现了真正的神迹，是时候皈依真正的信仰了。\n\n#italic @DvT_main!安排尘世执政、龙王、月神或旅行者担任我们的内阁总管后，我们便可以皈依其信仰。#!\n#E 若看不到要皈依的信仰，请记得取消掉p社神秘的“国内存在”的筛选器。#!"
 AG_Convert_to_Archonism_tooltip: "我们将会皈依魔神信仰，我们的首都的所有[population|e]也都会皈依。\n#E 后续可以通过内阁行动$DvT_Convert_pop_to_Archonism$花费原石使某省份所有[population|e]皈依。#!"