 DvT_events.1.title: "探索提瓦特mod相关说明"
 DvT_events.1.desc: "#G 欢迎订阅本mod！#!\n\n#E 【使用方法】#!\n在首都建造建筑冒险家协会，即可开始体验本mod的内容。\n\n#E 建筑冒险家协会：#!冒险家们会协助我们提高对地方的[control|e]！\n冒险家协会需先在首都建造（总部），方可在地方建造（分部）。\n建造在首都可以提高对全国的[control|e]。在地方建造可以提高当地的[control|e]。可以帮助附庸建造。\n需要雇佣「神之眼」持有者。\n\n#E 国际组织冒险家协会：#!在首都建造建筑冒险家协会即可加入。\n随时间可以积累原石，使用原石可以获取原神角色和「神之眼」持有者。\n若帮助附庸在首都建造建筑冒险家协会，则附庸也会加入该国际组织、积累原石、获取原神角色与「神之眼」持有者。\n\n#E 原神角色、「神之眼」持有者阶层：#!\n原神角色从属于「神之眼」持有者[estate|e]。授予[estate_privilege|e]后便可将其雇佣进入[cabinet|e]或成为[commander|e]，成为国家或[subject|e]的[ruler|e]。\n建筑冒险家协会需要雇佣「神之眼」持有者才能工作。\n吞并其他国家后，可以获得其原神角色。\n\n#E 原神领附庸：#!\n拥有原神角色并给予对应的[estate_privilege|e]后，可以通过与原神角色的角色互动，派遣原神角色作为[ruler|e]，来创建原神领类型的特殊[subject|e]。\n原神领对地方有更高的[control|e]，每个在国际组织冒险家协会中的原神领还会为[overlord|e]额外提供原石。\n可以在附庸行动中随时无条件收回。\n\n#E 魔神信仰宗教组：#!\n任命神明为内阁首脑后，即可在国际组织冒险家协会中选择[convert|e]对应的魔神信仰[religion|e]。\n可以通过内阁行动花费原石一键[convert|e]某[province|e]所有[pop|e]的[religion|e]。\n\n#E UI大发现：#!社会-人口-角色\n在这里你可以浏览所拥有的所有角色，获取原神角色后记得去查看哟~"
 DvT_events.1.a: "「向着星辰与深渊！」"
 DvT_events.1.b: "EU5太难辣，我要领新手补贴！"
