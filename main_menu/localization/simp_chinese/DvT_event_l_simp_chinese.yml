 DvT_events.1.title: "探索提瓦特mod相关说明"
 DvT_events.1.desc: "#G 欢迎订阅本mod！#!\n\n#E 【使用方法】#!\n在首都建造建筑冒险家协会，即可开始体验本mod的内容。\n\n#E 建筑冒险家协会：#!冒险家们会协助我们提高对地方的控制！\n冒险家协会需先在首都建造（总部），方可在地方建造（分部）。\n建造在首都可以提高对全国的控制力。在地方建造可以提高当地的控制力。可以帮助附庸建造。\n需要雇佣「神之眼」持有者。\n\n#E 国际组织冒险家协会：#!在首都建造建筑冒险家协会即可加入。\n随时间可以积累原石，使用原石可以获取原神角色和「神之眼」持有者。\n若帮助附庸在首都建造建筑冒险家协会，则附庸也会加入该国际组织、积累原石、获取角色与「神之眼」持有者。\n\n#E 原神角色、「神之眼」持有者阶层：#!\n原神角色从属于「神之眼」持有者阶层。授予阶层特权后便可将其雇佣进入内阁或者成为将领。\n建筑冒险家协会需要雇佣「神之眼」持有者才能工作。\n\n#E 原神领附庸：#!\n拥有原神角色并给予对应的阶层特权后，可以通过与原神角色的角色互动，派遣原神角色作为统治者，来创建原神领类型的特殊附庸国。\n原神领类型的特殊附庸国对地方有更高的控制力，每个在国际组织冒险家协会中的原神领还会为宗主过额外提供原石。\n\n#E 魔神信仰宗教组：#!\n任命神明为内阁首脑后，即可在国际组织冒险家协会中选择皈依对应的魔神信仰宗教。\n可以通过内阁行动花费原石一键转换某省份所有pop的宗教。\n\n#E UI大发现：#!社会-人口-角色\n在这里你可以浏览所拥有的所有角色，获取原神角色后记得去查看哟~"
 DvT_events.1.a: "「向着星辰与深渊！」"
 DvT_events.1.b: "EU5太难辣，我要领新手补贴！"
