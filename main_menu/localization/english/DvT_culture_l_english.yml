 teyvat_group: "Teyvat"
 teyvat_group_desc: "You have arrived in Teyvat — a fantasy world where the seven elements flow and converge.\nIn the distant past, the Archons granted mortals unique elemental abilities. With the help of such powers, people formed a bountiful homeland out of the wilderness. However, 500 years ago, the collapse of an ancient civilization turned the universe upside down...\nThough the calamity the world suffered has ceased, peace has yet to be restored."
