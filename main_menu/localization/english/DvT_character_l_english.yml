 DvT_character_events.1.desc: "A seed that lights up the night. No matter the distance apart, guided by the stone's glimmer, the fated will meet under the stars.\nA fateful stone that connects dreams. Its glimmers can entwine fates and connect dreams, just as how its glimmer links stars into the shapes of a heart's desires."
