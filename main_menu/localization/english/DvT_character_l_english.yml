 DvT_character_events.1.a: "Destined Fate"
 DvT_anemo_trait: "@anemo! Anemo Element"
 DvT_anemo_text: "\"Still, the winds change direction.\n\"Someday, they will blow towards a brighter future...\n\"Take my blessings and live leisurely from this day onward.\""
 desc_DvT_anemo_trait: "@anemo! $DvT_anemo_text$"
 DvT_geo_trait: "@geo! Geo Element"
 DvT_geo_text: "\"The currencies that flow through this land are my flesh and blood.\nFor thus did I become the guarantor of the people's hard work, wisdom, and future.\nThis is the trust I have placed in them. Betray it, and you taint my blood.\""
 desc_DvT_geo_trait: "@geo! $DvT_geo_text$"
 DvT_electro_trait: "@electro! Electro Element"
 DvT_electro_text: "\"This body is the noblest and most eminent of all in this world.\n\"It should hold absolute control over this world.\n\"It once promised its people a dream: the never-changing 'eternity.'\""
 desc_DvT_electro_trait: "@electro! $DvT_electro_text$"
 DvT_dendro_trait: "@dendro! Dendro Element"
 DvT_dendro_text: "\"I had a very, very long dream...\"\n\"In it, people were holding hands, dancing in a circle, be they sages or fools, dancers or warriors, puppets or statues of gods...\"\n\"That dancing circle embodied everything about the universe. Life has always been the end, while it is wisdom that shall be the means.\""
 desc_DvT_dendro_trait: "@dendro! $DvT_dendro_text$"
 DvT_hydro_trait: "@hydro! Hydro Element"
 DvT_hydro_text: "\"My ideals have no stains.\nI must correct you. People here bear no sins in the eyes of the gods... Only laws and the Tribunal can judge someone.\nThey can judge even me. So praise my magnificence and purity.\""
 desc_DvT_hydro_trait: "@hydro! $DvT_hydro_text$"
 DvT_pyro_trait: "@pyro! Pyro Element"
 DvT_pyro_text: "\"A pilgrimage for a wish; a battle to earn a name...\nBurnt to cinders for a dream.\nIf the intention yet remains, achieved ▉▉'s truth he has.\""
 desc_DvT_pyro_trait: "@pyro! $DvT_pyro_text$"
 DvT_cryo_trait: "@cryo! Cryo Element"
 DvT_cryo_text: "\"Sorry... to also have you shoulder the grievances of the world.\n\"Since you could endure my bitter cold, you must have the desire to burn?\n\"Then, burn away the old world for me.\""
 desc_DvT_cryo_trait: "@cryo! $DvT_cryo_text$"
 DvT_all_trait: "@other! Descenders"
 DvT_other_text: "\"Welcome to this world.\""
 desc_DvT_all_trait: "@other! $DvT_other_text$"

 DvT_Mondstadt_trait: "@Mondstadt! Mondstadt"
 DvT_Mondstadt_text: "Mondstadt is a city of freedom that lies in the northeast of Teyvat, known as \"the City of Wind and Song\"。Worshiping Barbatos, the Anemo Archon and God of Freedom, it is one of the seven nations of Teyvat.\nFrom amongst mountains and wide-open plains, carefree breezes carry the scent of dandelions — a gift from the Anemo God, Barbatos — across Cider Lake to Mondstadt, which sits on an island in the middle of the lake."
 desc_DvT_Mondstadt_trait: "@Mondstadt! $DvT_Mondstadt_text$"
 DvT_Liyue_trait: "@Liyue! Liyue"
 DvT_Liyue_text: "Liyue is a bountiful harbor that lies in the east of Teyvat, known as \"the Harbor of Stone and Contracts\". Worshiping Rex Lapis, the Geo Archon and God of Contracts, it is one of the seven nations of Teyvat.\nMountains stand tall and proud alongside the stone forest, that, together with the open plains and lively rivers, make up Liyue's bountiful landscape, which shows its unique beauty through each of the four seasons. Just how many gifts from the Geo God lie in wait amongst the rocks of Liyue's mountains?"
 desc_DvT_Liyue_trait: "@Liyue! $DvT_Liyue_text$"
 DvT_Inazuma_trait: "@Inazuma! Inazuma"
 DvT_Inazuma_text: "Inazuma is an isolated archipelago far east of Teyvat, known as \"the Islands of Thunder and Eternity\"。Worshiping Raiden Shogun, the Electro Archon and God of Eternity, it is one of the seven nations of Teyvat.\nOvercome endless thunderstorms and set foot on the islands of red maple and cherry blossoms. On winding shores and towering cliffs, and in forests and mountains full of secrets, witness the Eternity pursued by Her Excellency, the Almighty Narukami Ogosho."
 desc_DvT_Inazuma_trait: "@Inazuma! $DvT_Inazuma_text$"
 DvT_Sumeru_trait: "@Sumeru! Sumeru"
 DvT_Sumeru_text: "Sumeru is the city of scholars located in the west-central part of Teyvat, known as \"the Realm of Forest and Lore\". Its rainforest part is known as \"the Rainforest of Lore\" while the desert part is known as \"the Gilded Desert\". Worshiping Lesser Lord Kusanali, the Dendro Archon and God of Wisdom，it is one of the seven nations of Teyvat.\nA fantastical nation of both lush rainforest and barren desert, where countless fruits of wisdom grow and are buried. Whether Travelers travel from afar through the forest to reach the academy city or delve deep into the desert to discover the historical ruins of the red desert, a wealth of valuable knowledge awaits them here."
 desc_DvT_Sumeru_trait: "@Sumeru! $DvT_Sumeru_text$"
 DvT_Fontaine_trait: "@Fontaine! Fontaine"
 DvT_Fontaine_text: "Fontaine a court of law on the terrestrial sea in the center of Teyvat, known as \"the Court of Water and Justice\". Worshiping Focalors, the Hydro Archon and God of Justice, it is one of the seven nations of Teyvat.\nFollowing the direction of pure currents, crossing wilderness, the depths of the forests and vastness of the sea of sand, arriving at the origin of all the waters of the continent. At the top of the waterfall, in the depths of the capital atop the terrestrial sea... a story that has never been heard, a legend that has been forgotten, like a lost kingdom sunken beneath the waves, yearning for a bard to sing its drowned songs."
 desc_DvT_Fontaine_trait: "@Fontaine! $DvT_Fontaine_text$"
 DvT_Natlan_trait: "@Natlan! Natlan"
 DvT_Natlan_text: "Natlan is a nation of oaths situated in the western regions of Teyvat, known as \"the Land of Fire and Competition\"，Worshiping Mavuika, the Pyro Archon and God of War, it is one of the seven nations of Teyvat.\nGuided by the flame, you pass through lengthy gorges and valleys to reach the land where the torches blaze, where all fires converge. Upon the blazing fields where Saurians roam, witness the end of the ancient war alongside the valiant warriors who resist the darkness."
 desc_DvT_Natlan_trait: "@Natlan! $DvT_Natlan_text$"
 DvT_NodKrai_trait: "@NodKrai! Nod-Krai"
 DvT_NodKrai_text: "Nod-Krai is the moon-blessed land located in the northwestern regions of Teyvat, known as \"an Elysium of Moonlight and Wanderings\", which is an autonomous region of Snezhnaya.\nFollow the silver thread spun by the new moon, traverse biting gales and desolate tundras as the snow-kissed lakes, fractured like mirrors, reflect their ageless, glacial radiance. The days are bitterly short, and the night stretches on like a dark, yawning maw. But even then, the light and song of the Welkin Moon will dance gently across the faces of visiting travelers. Up at ye towers, and let your lanterns blaze into the darkness! Until the day comes... when true moonlight bathes this land once more."
 desc_DvT_NodKrai_trait: "@NodKrai! $DvT_NodKrai_text$"
 DvT_Snezhnaya_trait: "@Snezhnaya! Snezhnaya"
 DvT_Snezhnaya_text: "Snezhnaya is a nation of Teyvat，Worshiping the Tsaritsa, the Cryo Archon."
 desc_DvT_Snezhnaya_trait: "@Snezhnaya! $DvT_Snezhnaya_text$"
 DvT_Other_trait: "@Other! Another World"
 DvT_Other_text: "Planet, namely \"World\". Every planet has their own laws. There may be civilization on planet. People from those civilizations can traverse the cosmos via spaceship, namely interstellar travel. There are trades and wars between people from planets. There are interstellar travel hubs between planets. The ultimate law of universe is that \"all who exist must one day perish...\""
 desc_DvT_Other_trait: "@Other! $DvT_Other_text$"
