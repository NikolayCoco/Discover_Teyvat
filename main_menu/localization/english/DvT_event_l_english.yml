l_english:
 DvT_events.1.title: "A Guide to the 'Discover Teyvat' Mod"
 DvT_events.1.desc: "#G Welcome to the mod!#!\n\n#E 【How to Use】#!\nConstruct the Adventurers' Guild building in your capital to begin experiencing the mod's content.\n\n#E The Adventurers' Guild Building:#! Adventurers will help us enhance our control over locations!\nThe building must first be built in the capital(headquarters) before buildings can be constructed in other provinces(Branch).\nBuilding it in the capital increases control nationwide. Building it in a province increases local control. You can help your subjects construct it.\nRequires the employment of Vision Wielders.\n\n#E The Adventurers' Guild International Organization:#!Joining is unlocked by constructing the Adventurers' Guild building in your capital.\nOver time, you will accumulate Primogems, which can be used to obtain Genshin Characters and Vision Wielders.\nIf you help a subject construct the Adventurers' Guild in their capital, they will also join the organization, accumulate Primogems, and obtain characters and Vision Wielders.\n\n#E Genshin Characters & the Vision Wielder Estate:#!\nGenshin Characters belong to the Vision Wielder estate. After granting the appropriate estate privileges, you can employ them in your cabinet or as commanders.\nThe Adventurers' Guild building requires employed Vision Wielders to function.\n\n#E Special Vassal Genshin Land：#!\nOnce obtaining the Genshin Characters and granting the appropriate estate privileges, you can create a special vassal state in the type of Genshin Land through CI to appointed Genshin Characters as ruler.\nGenshin Land has higher control and each Genshin Land member in the Adventurers' Guild IO will provide additional Primogems for lord.\n\n#E The Archon Faith Religion Group:#!\nAfter appointing an Archon as the head of your cabinet, you may choose to convert to their corresponding Archon Faith religion through the IO action in Adventurers' Guild.\nThrough a cabinet action, you can spend Primogems to convert the religion of all pops in a province with one click.\n\n#E UI Discovery:#!Society-Population-Characters\nHere you can browse all the characters you possess. Remember to check this tab after obtaining new Genshin Characters~"
 DvT_events.1.a: "\"Ad astra abyssosque!\""
 DvT_events.1.b: "EU5 is too hard, I demand the Newbie Subsidy!"
 STATIC_MODIFIER_NAME_DvT_start: "Discover Teyvat"
 STATIC_MODIFIER_DESC_DvT_start: "Welcome to join our QQ group: 959166763. Feedback is welcome, and casual chat is even more welcome! Topics can range from Paradox games, miHoYo games, to general anime-related discussions."