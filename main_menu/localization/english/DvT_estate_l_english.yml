l_english:
 vision_estate: "Vision Wielder"
 vision_estate_desc: "When faced with circumstances that they cannot control, humans often bemoan their powerlessness. But if a person is found to have surpassing ambition even as their life reaches such a desperate turning point, then the gods would look upon them with favor. This favor is the Vision, an external magical focus given to those who have been acknowledged by the gods which they can use to channel elemental power.\nEvery wielder of a Vision is one who can attain godhood and ascend to Celestia. We call such people allogenes. This is a secret that only archons are privy to."
 vision_pop: "Vision Wielder"
 vision_pop_desc: "These represent the Vision Wielders come from the another world."
 MODIFIER_TYPE_NAME_vision_estate_target_satisfaction: "$vision_estate$ Satisfaction Equilibrium"
 MODIFIER_TYPE_DESC_vision_estate_target_satisfaction: "This impacts the [estate_satisfaction_equilibrium|e] of the $vision_estate$ in this [country|e]."
 MODIFIER_TYPE_NAME_vision_estate_satisfaction_decay: "$vision_estate$ Satisfaction Decay"
 MODIFIER_TYPE_DESC_vision_estate_satisfaction_decay: "This impacts how quickly the [estate_satisfaction|e] decays down to the [estate_satisfaction_equilibrium|e] for the $vision_estate$ in this [country|e]."
 MODIFIER_TYPE_NAME_vision_estate_satisfaction_recovery: "$vision_estate$ Satisfaction Recovery"
 MODIFIER_TYPE_DESC_vision_estate_satisfaction_recovery: "This impacts how quickly the [estate_satisfaction|e] recovers to the [estate_satisfaction_equilibrium|e] for the $vision_estate$ in this [country|e]."
 MODIFIER_TYPE_NAME_global_vision_estate_power: "$vision_estate$ [estate_power|e]"
 MODIFIER_TYPE_DESC_global_vision_estate_power: "This impacts the [estate_power|e] of the $vision_estate$ in the entire [country|e]."
 MODIFIER_TYPE_NAME_local_vision_estate_power: "Local $vision_estate$ [estate_power|e]"
 MODIFIER_TYPE_DESC_local_vision_estate_power: "This impacts the [estate_power|e] of the $vision_estate$ in this [location|e]."
 MODIFIER_TYPE_NAME_vision_estate_allowed_in_cabinet: "$vision_estate$ Allowed in Cabinet"
 MODIFIER_TYPE_DESC_vision_estate_allowed_in_cabinet: "This allows [characters|e] from the [ShowEstateTypeName('vision_estate')] [estate|e] to be employed in the [cabinet|e]."
 MODIFIER_TYPE_NAME_vision_estate_allowed_leading_military: "$vision_estate$ Allowed to Command"
 MODIFIER_TYPE_DESC_vision_estate_allowed_leading_military: "This allows [characters|e] from the [ShowEstateTypeName('vision_estate')] [estate|e] to become [generals|e] and [admirals|e]"
 vision_estate_satisfaction: "[ShowEstateTypeName('vision_estate')] [estate_satisfaction|e]"
 vision_estate_power: "[ShowEstateTypeName('vision_estate')] [estate_power|e]"
 vision_estate_base: "Integrate Vision Wielder Community"
 vision_estate_base_desc: "Vision Wielderare few in number and scattered far and wide. To better manage them and allow them to play a greater role in national affairs, we should integrate their dispersed communities.\n#G This is the foundation for other privileges.#!"
 vision_estate_anemo: "Mastery of @anemo! Anemo"
 vision_estate_anemo_desc: "@anemo! The power of Anemo can reduce the cost of reshaping nature, aid our merchant ships in sailing, and allow our armies to pursue enemies with greater speed.\n#G If#! @anemo! #T Venti#! #G is present, the bonuses from this privilege are doubled.#!"
 vision_estate_geo: "Mastery of @geo! Geo"
 vision_estate_geo_desc: "@geo! The power of Geo can aid in construction, protect our trade, and strengthen our fortifications.\n#G If#! @geo! #Y Zhongli#! #G is present, the bonuses from this privilege are doubled.#!"
 vision_estate_electro: "Mastery of @electro! Electro"
 vision_estate_electro_desc: "@electro!The power of Electro can help strengthen local governance, increase our prestige, and enhance our armies.\n#G If#! @electro! #V Raiden Shogun#! #G is present, the bonuses from this privilege are doubled.#!"
 vision_estate_dendro: "Mastery of @dendro! Dendro"
 vision_estate_dendro_desc: "@dendro!The power of Dendro can aid production, strengthen ties with our subject states, and enhance our siege capabilities.\n#G If#! @dendro! #J Nahida#! #G is present, the bonuses from this privilege are doubled.#!"
 vision_estate_hydro: "Mastery of @hydro! Hydro"
 vision_estate_hydro_desc: "@hydro!The power of Hydro can help stabilize the nation, accelerate colonial development, and heal our wounded.\n#G If#! @hydro! #M Furina#! #G or @hydro!#! #M Neuvillette#! #G is present, the bonuses from this privilege are doubled.#!"
 vision_estate_pyro: "Mastery of @pyro! Pyro"
 vision_estate_pyro_desc: "@pyro!The power of Pyro can fuel scientific experiments and enhance the firepower of our armies and navies.\n#G If#! @pyro! #R Mavuika#! #G is present, the bonuses from this privilege are doubled.#!"
 vision_estate_cryo: "Mastery of @cryo! Cryo"
 vision_estate_cryo_desc: "@cryo!The power of Cryo can help reclaim wastelands and improve the adaptability of our armies and navies."
 vision_estate_leader: "Grants Vision Wielder Military Command"
 vision_estate_leader_desc: "Allows Vision Wielder to lead armies and navies in battle."
 vision_estate_advisor: "Grants Vision Wielder Advisory Right"
 vision_estate_advisor_desc: "Allows Vision Wielder to offer counsel and advice。"