l_english:
 DvT_adventurer_guild_IO: "Adventurers' Guild"
 DvT_adventurer_guild_IO_desc: "#italic \"Ad astra abyssosque! Welcome to the Adventurers' Guild.#!"
 AG_desc: "Adventurers' Guild realizes our connection with Teyvat. Here, we may encounter companions from Another World."
 DvT_adventurer_guild_IO_hint_title: "$DvT_events.1.title$"
 DvT_adventurer_guild_IO_hint_desc: "$DvT_events.1.desc$"
 AG_Pay_30: "@WelkinMoon! Long-term Investment in Adventurers' Guild"
 DvT_luno_text: "A ritual prayer, recited on the rising of the first new moon, to ask for the moon's blessing in the form of wealth and good fortune. For your purposes, the new moon you shall pray to is the first-ever new moon in Teyvat, since it's the first one you've seen here."
 AG_Pay_30_desc: "@WelkinMoon! $DvT_luno_text$\n\n#italic @WelkinMoon! The most cost-effective monthly card!#!"
 AG_Pay_30_desc_2: "Pay #N -30#!@gold! to gain #P 300#!@primogem! at once, and obtain the #italic Blessing of the Welkin Moon @WelkinMoon!#!: an additional #P 90#!@primogem! per month for 30 months."
 AG_Pay_30_tooltip_1: "Gain #P 300#!@primogem!"
 AG_Pay_30_tooltip_2: "Gain #italic Blessing of the Welkin Moon#!: an additional #P 90#!@primogem! per month for 30 months."
 AG_Pay_648: "@GenesisCrystal! One-time Investment in Adventurers' Guild"
 AG_Pay_648_desc: "@GenesisCrystal! An energy crystal from the very origin of the universe. Formed from within nothingness out of pure potential and hope, it contains enough energy to create a newborn star.\n\n#italic @primogem! Double bonus, never expires!#!"
 AG_Pay_648_desc_2: "Pay #N -648#!@gold! to gain #P 12960#!@primogem! at once."
 AG_Pay_648_tooltip: "Gain #P 12960#!@primogem!"
 AG_Primogem: "@primogem! Primogem"
 AG_Primogem_desc: "@primogem! A primordial crystalline gem that's beyond the mundane world. Shines with the condensed hopes and dreams of universes that once were."
 AG_Primogem_Blessing: "@WelkinMoon! Blessing of the Welkin Moon"
 AG_Primogem_Blessing_desc: "@WelkinMoon! $DvT_luno_text$"
 AG_Primogem_Change: "Monthly Change"
 AG_Primogem_Change_Value: "Gain #P 60#!@primogem!  fixed monthly. With the #italic Blessing of the Welkin Moon @WelkinMoon!#!, gain an additional #P 90#!@primogem! per month. With every Genshin Land vassal in the Adventurers' Guild IO, gain an additional #P 10#!@primogem! per month."
 AG_has_Primogem_Blessing_text: "(Blessing of the Welkin Moon @WelkinMoon! duration consumed:[GetPlayer.MakeScope.GetVariable('AG_Primogem_Blessing').GetValue] months)"
 AG_create_character: "@IntertwinedFate! Invite Genshin Character"
 AG_create_character_desc: "@IntertwinedFate! A fateful stone that connects dreams. Its glimmers can entwine fates and connect dreams, just as how its glimmer links stars into the shapes of a heart's desires.\n\n#italic @IntertwinedFate! Invite a Genshin Character to join our nation.!#!"
 DvT_exist_character_tooltip: "@IntertwinedFate! Exist Genshin Characters to be Invited"
 DvT_create_character_random_tooltip: "@IntertwinedFate! Randomly #P gain one#! Genshin Characters."
 AG_create_pop: "@AcquaintFate! Invite Vision Wielders"
 AG_create_pop_desc: "@AcquaintFate! A seed that lights up the night. No matter the distance apart, guided by the stone's glimmer, the fated will meet under the stars.\n\n#italic @AcquaintFate! Invite Vision Wielders to fill vacancies within our Adventurers' Guild.#!"
 AG_Pay_1600_tooltip: "Pay #N -1600#!@primogem!."
 AG_Primogem_for_golden: "@gold! Convert Primogems"
 AG_Primogem_for_golden_desc: "@gold! When you have surplus Primogems or require gold urgently, you may convert Primogems into gold."
 AG_Convert_to_Archonism: "@DvT_main! Convert to the Archon Faith"
 AG_Convert_to_Archonism_desc: "@DvT_main! The Archon has shown us a true miracle. It is time to convert to the true faith.\n\n#italic @DvT_main! After appointing an Archon, Sovereign, Moon Godness or Traveler as the head of your cabinet, you may choose to convert to their corresponding Archon Faith religion#!\n#E If you can't find the faith to convert to, please remember to cancel the mysterious Paradox's filter \"Present in Country\".#!"
 AG_Convert_to_Archonism_tooltip: "We will convert to the faith of Archon, and all the pops in our capital will also convert.\n#E Subsequently, through a cabinet action $DvT_Convert_pop_to_Archonism$, you can spend Primogems to convert all pops in a province.#!"